<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NilamKu — Catatan Minyak Nilam</title>
<meta name="theme-color" content="#0FA968">
<meta name="description" content="Catat penyulingan, stok dan penjualan minyak nilam.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --hijau:#0FA968;
    --hijau-tua:#0A8A55;
    --biru:#1F7AE0;
    --biru-tua:#1565C0;
    --grad:linear-gradient(135deg,#0FA968 0%,#1199C4 48%,#1F7AE0 100%);
    --tinta:#0E2438;
    --tinta-2:#5B7288;
    --putih:#ffffff;
    --kertas:#F6FAFD;
    --garis:#E2ECF5;
    --merah:#D64545;
    --radius:20px;
    --bayang:0 12px 32px rgba(16,64,110,.09);
    --bayang-kecil:0 3px 10px rgba(16,64,110,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:
      radial-gradient(900px 520px at 6% -12%,#E3F8F0 0%,rgba(227,248,240,0) 62%),
      radial-gradient(820px 480px at 96% -6%,#E4EFFE 0%,rgba(228,239,254,0) 62%),
      var(--kertas);
    background-attachment:fixed;
    color:var(--tinta);
    line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 64px}

  header.top{
    position:relative;overflow:hidden;
    background:linear-gradient(120deg,#0EA271 0%,#0E9CBC 46%,#1F7AE0 100%);
    color:#fff;border-radius:0 0 30px 30px;
    padding:30px 18px 52px;
    box-shadow:0 20px 44px rgba(17,120,180,.24);
  }
  header.top::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(420px 220px at 12% -10%,rgba(255,255,255,.28),transparent 70%),
      radial-gradient(360px 200px at 92% 10%,rgba(255,255,255,.18),transparent 72%);
  }
  header .inner{position:relative;z-index:1;max-width:900px;margin:0 auto;display:flex;gap:14px;align-items:flex-start}
  .logo{
    width:52px;height:52px;flex:0 0 auto;border-radius:16px;
    background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
    display:grid;place-items:center;backdrop-filter:blur(6px);
  }
  header h1{font-size:1.4rem;margin:0;letter-spacing:-.3px;font-weight:750}
  header p{margin:3px 0 0;font-size:.83rem;color:rgba(255,255,255,.9)}
  .badge{
    display:inline-flex;align-items:center;gap:6px;margin-top:9px;
    font-size:.7rem;font-weight:700;letter-spacing:.3px;
    padding:4px 11px;border-radius:999px;
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.38);
    color:#fff;backdrop-filter:blur(6px);
  }

  h2.bagian{
    font-size:1rem;margin:28px 0 12px;color:var(--tinta);
    display:flex;align-items:center;gap:9px;letter-spacing:-.1px;
  }
  h2.bagian::before{content:"";width:6px;height:18px;border-radius:999px;background:var(--grad)}

  .grid-stats{
    display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:-40px;
    position:relative;z-index:2;
  }
  @media(min-width:680px){.grid-stats{grid-template-columns:repeat(3,1fr);gap:14px}}
  @media(max-width:430px){
    .stat{padding:12px;gap:9px}
    .stat .ikon{width:34px;height:34px;border-radius:10px}
    .stat .val{font-size:1.02rem}
    .stat .lbl{font-size:.63rem;letter-spacing:.5px}
  }
  .stat{
    background:var(--putih);border:1px solid var(--garis);border-radius:18px;
    padding:14px;box-shadow:var(--bayang);
    display:flex;gap:11px;align-items:flex-start;
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .stat:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(16,64,110,.13)}
  .stat .ikon{width:40px;height:40px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center}
  .stat:nth-child(1) .ikon{background:#E4F8F0;color:#0A8A55}
  .stat:nth-child(2) .ikon{background:#E5F0FE;color:#1565C0}
  .stat:nth-child(3) .ikon{background:#E8F8F3;color:#0FA968}
  .stat:nth-child(4) .ikon{background:#EBF2FF;color:#1F7AE0}
  .stat:nth-child(5) .ikon{background:#FFF3E6;color:#B4691E}
  .stat:nth-child(6) .ikon{background:linear-gradient(135deg,#E4F8F0,#E5F0FE);color:#0A8A55}
  .stat.unggul{
    background:linear-gradient(180deg,#FFFFFF 0%,#F1FBF6 100%);
    border-color:#BFE3D2;box-shadow:0 14px 32px rgba(15,169,104,.15);
  }
  .stat.unggul .val{color:var(--hijau-tua);font-size:1.24rem}
  .minus{color:var(--merah)!important}

  .grafik-kartu{margin-top:18px}
  .grafik-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .grafik-head h3{margin:0}
  .legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--tinta-2);font-weight:600;margin-bottom:6px}
  .legenda span{display:inline-flex;align-items:center;gap:6px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:3px}
  .dot.hijau{background:#0FA968}
  .dot.biru{background:#1F7AE0}
  .grafik svg{display:block;width:100%;height:auto}
  .sub-judul{font-size:.78rem;margin:16px 0 6px;color:var(--tinta-2);font-weight:700;letter-spacing:.2px}

  /* ---------- login & peran ---------- */
  body[data-peran="pro"] .hanya-admin,
  body[data-peran="biasa"] .hanya-admin,
  body[data-peran="biasa"] .hanya-pro,
  body[data-peran="tamu"] .hanya-admin,
  body[data-peran="tamu"] .hanya-pro{display:none!important}

  .gerbang{
    position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px;
    background:
      radial-gradient(620px 400px at 10% 0%,rgba(15,169,104,.45),transparent 65%),
      radial-gradient(620px 440px at 92% 100%,rgba(31,122,224,.5),transparent 65%),
      linear-gradient(140deg,#0E2438,#0B3A53 55%,#122A45);
  }
  .gerbang-kartu{
    width:100%;max-width:370px;background:#fff;border-radius:20px;padding:22px;
    box-shadow:0 30px 70px rgba(6,20,40,.42);
  }
  .gerbang-logo{
    width:52px;height:52px;border-radius:16px;background:var(--grad);
    display:grid;place-items:center;margin-bottom:14px;
  }
  .gerbang-kartu h2{margin:0 0 4px;font-size:1.15rem;color:var(--tinta);letter-spacing:-.2px}
  .gerbang-kartu .ket{margin:0 0 14px;font-size:.82rem;color:var(--tinta-2)}
  .gerbang-kartu label{margin-top:12px}
  .pesan-salah{color:var(--merah);font-size:.8rem;font-weight:700;margin:10px 0 0;min-height:1.1em}

  .pengguna{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .pengguna-info{display:flex;flex-direction:column;text-align:right;line-height:1.25}
  .pengguna-info strong{font-size:.82rem;color:#fff}
  .pengguna-info span{font-size:.66rem;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.6px}
  .keluar{
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.42);color:#fff;
    font:inherit;font-size:.74rem;font-weight:700;padding:7px 12px;border-radius:10px;
    cursor:pointer;transition:background .16s ease;
  }
  .keluar:hover{background:rgba(255,255,255,.28)}
  @media(max-width:520px){
    header .inner{flex-wrap:wrap}
    .pengguna{
      margin-left:0;width:100%;justify-content:space-between;
      border-top:1px solid rgba(255,255,255,.25);padding-top:10px;margin-top:2px;
    }
    .pengguna-info{text-align:left}
  }
